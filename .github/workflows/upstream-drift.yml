name: Upstream drift
on:
  schedule:
    - cron: '23 9 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: upstream-drift
  cancel-in-progress: false
jobs:
  inputs:
    name: drift-inputs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      old: ${{ steps.resolve.outputs.old }}
      candidate: ${{ steps.resolve.outputs.candidate }}
      record_sha256: ${{ steps.produce.outputs.record_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.14.0
      - name: Resolve main once and temporarily repin this checkout
        id: resolve
        run: node scripts/upstream-drift.mjs resolve
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Holaxis-ai/superbee
          ref: ${{ steps.resolve.outputs.candidate }}
          path: upstream-source
          persist-credentials: false
      - name: Attempt exact candidate package production
        id: produce
        run: |
          npm run --silent produce:inputs upstream-source "$RUNNER_TEMP/inputs" > "$RUNNER_TEMP/producer.json"
          node --input-type=module -e "import fs from 'node:fs'; const p=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/producer.json')); fs.appendFileSync(process.env.GITHUB_OUTPUT,'record_sha256='+p.recordSha256+'\n');"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: drift-inputs
          path: ${{ runner.temp }}/inputs
          if-no-files-found: error
  consumer-build:
    name: drift-consumer-build
    needs: inputs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.14.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: drift-inputs
          path: inputs
      - name: Bind candidate input bytes to producer
        env:
          EXPECTED_INPUT_SHA256: ${{ needs.inputs.outputs.record_sha256 }}
        run: node scripts/check-digest.mjs inputs/inputs.json EXPECTED_INPUT_SHA256
      - name: Temporarily repin consumer to the resolved candidate
        env:
          CANDIDATE_COMMIT: ${{ needs.inputs.outputs.candidate }}
        run: node scripts/upstream-drift.mjs repin
      - name: Attempt candidate consumer build from tarballs only
        run: |
          test ! -e upstream-source
          npm ci --ignore-scripts --force --no-audit --no-fund
          npm run build -- --inputs inputs/inputs.json
          npm run typecheck
          npm run verify:package -- --inputs inputs/inputs.json
  report:
    name: drift-report
    needs: [inputs, consumer-build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.14.0
      - name: Report attempt and fail for drift or incomplete builds
        env:
          OLD_COMMIT: ${{ needs.inputs.outputs.old }}
          CANDIDATE_COMMIT: ${{ needs.inputs.outputs.candidate }}
          INPUTS_RESULT: ${{ needs.inputs.result }}
          CONSUMER_RESULT: ${{ needs.consumer-build.result }}
        run: node scripts/upstream-drift.mjs report
