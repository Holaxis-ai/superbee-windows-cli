name: Upstream drift
on:
  schedule:
    - cron: '23 9 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: upstream-drift
  cancel-in-progress: false
jobs:
  inputs:
    name: drift-inputs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      old: ${{ steps.resolve.outputs.old }}
      candidate: ${{ steps.resolve.outputs.candidate }}
      record_sha256: ${{ steps.produce.outputs.record_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.14.0
      - name: Install verification tools
        run: npm ci --ignore-scripts --force --no-audit --no-fund
      - name: Resolve next once and temporarily repin this checkout
        id: resolve
        run: npm exec -- node scripts/upstream-drift.mjs resolve
      - name: Attempt verified candidate package acquisition
        id: produce
        run: |
          npm run --silent registry:inputs -- inputs
          node scripts/upstream-drift.mjs transfer
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: drift-inputs
          path: inputs
          if-no-files-found: error
  consumer-build:
    name: drift-consumer-build
    needs: inputs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.14.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: drift-inputs
          path: inputs
      - name: Bind candidate input bytes to producer
        env:
          EXPECTED_INPUT_SHA256: ${{ needs.inputs.outputs.record_sha256 }}
        run: node scripts/check-digest.mjs inputs/inputs.json EXPECTED_INPUT_SHA256
      - name: Temporarily repin consumer from digest-bound manifest bytes
        run: node scripts/upstream-drift.mjs repin
      - name: Attempt candidate consumer build from tarballs only
        run: |
          npm ci --ignore-scripts --force --no-audit --no-fund
          npm run build -- --inputs inputs/inputs.json
          npm run typecheck
          npm run verify:package -- --inputs inputs/inputs.json
  report:
    name: drift-report
    needs: [inputs, consumer-build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.14.0
      - name: Report attempt and fail for drift or incomplete builds
        env:
          OLD_PAIR: ${{ needs.inputs.outputs.old }}
          CANDIDATE_PAIR: ${{ needs.inputs.outputs.candidate }}
          INPUTS_RESULT: ${{ needs.inputs.result }}
          CONSUMER_RESULT: ${{ needs.consumer-build.result }}
        run: node scripts/upstream-drift.mjs report
